name: oasis_priere
description: L'Oasis de la Prière — Application d'apprentissage de la prière musulmane pour enfants (7–13 ans)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Database locale (offline-first)
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: any
  path: ^1.9.0

  # Notifications locales (horaires de prière)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Audio (adhan, récitations, sons de postures)
  audioplayers: ^6.1.0

  # Capteurs (magnétomètre Qibla, gyroscope prière)
  sensors_plus: ^7.0.0

  # Permissions (microphone, notifications, localisation)
  permission_handler: ^11.3.1

  # Géolocalisation (calcul horaires par ville)
  geolocator: ^13.0.1

  # Préférences simples (onboarding done, theme)
  shared_preferences: ^2.3.2

  # Hachage PIN parental
  crypto: ^3.0.3

  # Vibrations haptiques (Tasbih, Qibla)
  vibration: ^2.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/prayer/
    - assets/audio/adhan/
    - assets/audio/sfx/
    - assets/audio/suras/
    - assets/images/
    - assets/data/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
